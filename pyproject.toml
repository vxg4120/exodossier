[project]
name = "exodossier"
version = "0.1.0"
description = "The evidence-synthesis layer for exoplanet discovery: a provenance-tracked identity graph reconciling the NASA Exoplanet Archive and ExoFOP, which disagree about the same stars and planets, across TIC, TOI, CTOI and KOI identifiers."
requires-python = ">=3.12"

[tool.pytest.ini_options]
# -W error: a warning is a failing test (SPEC / global rule).
addopts = "-q -W error"
markers = [
    "db: test requires a reachable DATABASE_URL (the exo database)",
    "graph: test asserts on the populated identity graph; skipped when the database is empty",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
